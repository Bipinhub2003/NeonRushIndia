name: Build Neon Rush India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Full Project
        run: |
          rm -rf project
          mkdir project
          unzip -o NeonRushIndia_FullCode.zip -d project

      - name: Check Project
        run: |
          echo "Checking Android project..."
          ls -la project
          ls -la project/app
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonRushIndia-APK
          path: project/app/build/outputs/apk/debug/*.apk
